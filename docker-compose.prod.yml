services:
  # ============================================================================
  # Fastify Production Backend API
  # ============================================================================
  api:
    image: kalya-api:production
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    container_name: kalya-api
    restart: always
    ports:
      # Bind to localhost (127.0.0.1) so reverse proxy (Caddy/Nginx) handles SSL
      - '127.0.0.1:3600:3600'
    env_file:
      - /opt/kalya/.env.production
    environment:
      - NODE_ENV=production
      - KALYA_PRIMARY.ENV=production
      - KALYA_SERVER.HOST=0.0.0.0
      - KALYA_SERVER.PORT=3600
      - KALYA_DATABASE.URL=/app/data/kalya.db
    volumes:
      # PERSISTENT: SQLite Database Directory (Named volume for WAL mode)
      - kalya_db_prod_data:/app/data
      # PERSISTENT: Uploads Directory (Host bind mount for easy backups)
      - /opt/kalya/uploads:/app/uploads
      # PERSISTENT: Application logs (Host bind mount for host logrotate)
      - /opt/kalya/logs:/app/logs
      # READ-ONLY: Production environment file from host
      - /opt/kalya/.env.production:/app/apps/api-server/.env:ro
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3600/health/ready',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'
    networks:
      - kalya-prod-network

  # ============================================================================
  # Prometheus: Metrics Collector
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: kalya-prometheus
    restart: always
    volumes:
      - /opt/kalya/infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_prod_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - kalya-prod-network

  # ============================================================================
  # Grafana: Metrics Visualization
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: kalya-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_prod_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - kalya-prod-network

# ==============================================================================
# Persistent Storage Volumes (Zero Cloud)
# ==============================================================================
volumes:
  kalya_db_prod_data:
    driver: local
  prometheus_prod_data:
    driver: local
  grafana_prod_data:
    driver: local

networks:
  kalya-prod-network:
    driver: bridge
