services:
  # Fastify Backend API
  api:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    container_name: kalya-api
    restart: unless-stopped
    ports:
      - '3600:3600'
    env_file:
      - apps/api-server/.env
    environment:
      - KALYA_SERVER.HOST=0.0.0.0
      - KALYA_SERVER.PORT=3600
      - KALYA_DATABASE.URL=/app/data/kalya.db
      - KALYA_SMTP.HOST=maildev
      - KALYA_SMTP.PORT=1025
      - KALYA_SMTP.SECURE=false
    volumes:
      - kalya_db_data:/app/data
      - kalya_uploads:/app/uploads
      - ./apps/api-server/.env.staging:/app/apps/api-server/.env.staging:ro
    depends_on:
      - maildev
    networks:
      - kalya-network

  # MailDev: Local SMTP Server & Web Inbox
  maildev:
    image: maildev/maildev:latest
    container_name: kalya-maildev
    restart: unless-stopped
    ports:
      - '1080:1080' # Web UI: http://localhost:1080
      - '1025:1025' # SMTP server: localhost:1025
    environment:
      - TZ=UTC
    networks:
      - kalya-network

  # Prometheus: Metrics Collector
  prometheus:
    image: prom/prometheus:latest
    container_name: kalya-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090' # Prometheus Web UI: http://localhost:9090
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - kalya-network

  # Grafana: Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: kalya-grafana
    restart: unless-stopped
    ports:
      - '3100:3000' # Grafana Web UI: http://localhost:3100
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/kalya-overview.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - kalya-network

volumes:
  kalya_db_data:
  kalya_uploads:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  kalya-network:
    driver: bridge
